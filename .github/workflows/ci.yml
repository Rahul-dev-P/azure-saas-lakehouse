name: CI - Code Quality & Testing

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax & Lint Check (flake8)
        run: |
          # Lint test and helper logic; halt build on syntax errors
          flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Transformation Tests (pytest)
        run: |
          pytest tests/ -v
