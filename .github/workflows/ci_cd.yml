name: CI/CD - Lakehouse Quality & Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================================
  # 1. CI JOB: Test & Lint Code
  # ==========================================================
  validate-and-test:
    name: Run Linting and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax & Lint Check (flake8)
        run: |
          flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Unit Tests (pytest)
        run: |
          pytest tests/ -v

  # ==========================================================
  # 2. CD JOB: Deploy to Databricks (Runs ONLY if CI passes on main)
  # ==========================================================
  deploy-to-databricks:
    name: Sync Notebooks to Databricks
    runs-on: ubuntu-latest
    needs: [validate-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Notebooks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks workspace import-dir databricks/notebooks /Workspace/Users/panchalraahul10@gmail.com/azure-saas-lakehouse --overwrite
